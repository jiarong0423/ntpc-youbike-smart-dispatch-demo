<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">歷史基準與近期偏移轉成動態區域調度</title>
  <desc id="desc">以歷史快照、近期流入快照、天氣週期、新站與交通物理條件形成區域調度任務。</desc>
  <rect width="1400" height="900" fill="#f7f9fc"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;letter-spacing:0}
    .title{font-size:34px;font-weight:800;fill:#17202a}
    .sub{font-size:17px;fill:#566573}
    .head{font-size:21px;font-weight:750;fill:#17202a}
    .body{font-size:16px;fill:#425466}
    .small{font-size:14px;fill:#637083}
    .card{fill:#fff;stroke:#d7dee8;stroke-width:1.5}
    .step{fill:#eaf1ff;stroke:#9eb7df;stroke-width:1.5}
    .action{fill:#eaf7f1;stroke:#8fcdb2;stroke-width:1.5}
    .line{stroke:#315b96;stroke-width:3;fill:none}
  </style>
  <text x="60" y="62" class="title">證據層如何轉成動態區域派工</text>
  <text x="60" y="96" class="sub">歷史資料快照建立基準，近期流入快照提取偏移，再依週期、生活圈與交通物理條件產生任務。</text>

  <rect x="60" y="140" width="300" height="120" rx="8" class="step"/>
  <text x="84" y="178" class="head">1. 歷史特徵基準</text>
  <text x="84" y="211" class="body">月份、時段、觀光區、學區</text>
  <text x="84" y="239" class="small">1-8 月曲線，9 月近期批次接續</text>

  <path d="M360 200 H405" class="line"/>
  <polygon points="405,200 392,192 392,208" fill="#315b96"/>

  <rect x="405" y="140" width="300" height="120" rx="8" class="step"/>
  <text x="429" y="178" class="head">2. 近期快照偏移</text>
  <text x="429" y="211" class="body">比較同一時間桶的供需變化</text>
  <text x="429" y="239" class="small">來源時間與新鮮度先通過閥門</text>

  <path d="M705 200 H750" class="line"/>
  <polygon points="750,200 737,192 737,208" fill="#315b96"/>

  <rect x="750" y="140" width="300" height="120" rx="8" class="step"/>
  <text x="774" y="178" class="head">3. 區域狀態判讀</text>
  <text x="774" y="211" class="body">天氣、長假、新站、路網障礙</text>
  <text x="774" y="239" class="small">只公開級別與行動方向</text>

  <path d="M1050 200 H1095" class="line"/>
  <polygon points="1095,200 1082,192 1082,208" fill="#315b96"/>

  <rect x="1095" y="140" width="245" height="120" rx="8" class="action"/>
  <text x="1119" y="178" class="head">4. 派工任務</text>
  <text x="1119" y="211" class="body">機車先遣或貨車搬運</text>
  <text x="1119" y="239" class="small">QR 認領、到站、完成、異常</text>

  <rect x="60" y="310" width="620" height="190" rx="8" class="card"/>
  <text x="88" y="350" class="head">天氣、長假與寒暑假週期</text>
  <text x="88" y="386" class="body">已留存證據顯示，觀光潮汐區、都市熱區與學區的時段型態不同。</text>
  <text x="88" y="418" class="body">長假或騎乘時間拉長時，借還回流變慢、周轉下降，需要提前備車。</text>
  <text x="88" y="450" class="body">策略：延長觀察窗，機車先遣盤點，貨車改在離峰順向發配。</text>
  <text x="88" y="482" class="small">證據：weather feature curves、holiday baseline、tidal evidence、暑假分組曲線</text>

  <rect x="720" y="310" width="620" height="190" rx="8" class="card"/>
  <text x="748" y="350" class="head">都市更新、新站與生活圈</text>
  <text x="748" y="386" class="body">新站快速增加會改變原有站點母體與生活圈供需，不沿用舊基準硬算。</text>
  <text x="748" y="418" class="body">策略：新增站先進版本化站點閥門，再更新歷史比較與區域任務。</text>
  <text x="748" y="450" class="body">河川、橋梁或幹道割裂時，優先在同側生活圈內達成動態平衡。</text>
  <text x="748" y="482" class="small">證據：station universe delta、地形與路網障礙 dry-run、生活圈分析</text>

  <rect x="60" y="540" width="620" height="190" rx="8" class="card"/>
  <text x="88" y="580" class="head">機車先遣與貨車離峰分工</text>
  <text x="88" y="616" class="body">機車負責快速巡站、盤點滯留或待回補車輛、確認現況與交接。</text>
  <text x="88" y="648" class="body">貨車負責實體自行車補車與拔車，依順向路線集中處理大批量缺口。</text>
  <text x="88" y="680" class="body">這是實體車輛調度，不建立虛擬車輛，也不控制官方車鎖或站點。</text>
  <text x="88" y="712" class="small">外部佐證：YouBike 調度職缺、自備機車與調度駕駛的現場分工</text>

  <rect x="720" y="540" width="620" height="190" rx="8" class="card"/>
  <text x="748" y="580" class="head">景安站長期壓力情境</text>
  <text x="748" y="616" class="body">既有站點 episode 與路網證據顯示，轉乘壓力需按時段與同側路線處理。</text>
  <text x="748" y="648" class="body">策略一：離峰調度，降低尖峰搬運干擾並一次完成順向回補。</text>
  <text x="748" y="680" class="body">策略二：評估電輔車配置，搭配起訖交易與見位率資料持續驗證。</text>
  <text x="748" y="712" class="small">此圖呈現既有證據支持的操作方案，不代表主管機關已採用該政策。</text>

  <rect x="60" y="775" width="1280" height="72" rx="8" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="84" y="808" class="body">公開輸出：行政區、狀態級別、建議行動、任務時間與交接狀態。</text>
  <text x="84" y="834" class="small">不公開：原始站點資料、精確分數、權重、閾值、特徵矩陣與核心聚合方法。</text>
</svg>
