<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>YouBike 任務交接</title>
    <link rel="stylesheet" href="./task.css">
  </head>
  <body>
    <main class="task-shell">
      <nav><a href="./index.html">返回任務池</a></nav>
      <header>
        <p class="eyebrow">Public task handoff</p>
        <h1>任務交接</h1>
        <span id="status-badge">載入中</span>
      </header>
      <section class="task-layout">
        <article class="task-detail">
          <dl>
            <div><dt>任務</dt><dd id="task-name">-</dd></div>
            <div><dt>區域</dt><dd id="task-district">-</dd></div>
            <div><dt>行動</dt><dd id="task-action">-</dd></div>
            <div><dt>交接</dt><dd id="task-route">-</dd></div>
            <div><dt>更新時間</dt><dd id="task-updated">-</dd></div>
          </dl>
          <div class="actions" aria-label="task actions">
            <button type="button" data-event="complete" disabled>完成任務</button>
          </div>
          <p id="runtime-notice">目前為本機任務帳本；此結果不代表 AWS 已同步。</p>
          <p id="message" role="status"></p>
        </article>
        <aside class="qr-panel">
          <img id="task-qr" alt="此任務的交接 QR code">
          <p>短期 QR 有效 5 分鐘；過期請由任務池重新開啟。</p>
          <a id="task-link" href="#">直接開啟此任務</a>
        </aside>
      </section>
    </main>
    <script src="./task.js"></script>
  </body>
</html>
